[package]
name = "skimmd"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Read markdown with speed and precision."
license = "Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities", "text-processing", "development-tools"]
keywords = ["markdown", "toc", "cli", "agent", "tooling"]
repository = "https://github.com/cwilper/skimmd"
homepage = "https://github.com/cwilper/skimmd"
documentation = "https://docs.rs/skimmd"

[lib]
name = "skimmd"
path = "src/lib.rs"

[[bin]]
name = "skimmd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
