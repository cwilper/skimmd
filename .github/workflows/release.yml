# Builds the `skimmd` release binary for six targets and attaches them to a
# GitHub Release created from the matching `vX.Y.Z` tag:
#
#   Linux  x86_64 / aarch64   (statically linked musl)
#   macOS  x86_64 / aarch64
#   Windows x86_64 / aarch64  (msvc)
#
#   git tag v0.1.0 && git push origin v0.1.0      # triggers this workflow
#
# crates.io publishing is a separate step (`cargo publish`) — see
# docs/release-guidance.md. The tag must match `version` in Cargo.toml.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, statically linked (musl). Cross-built on one Ubuntu runner.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  musl: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, musl: true }
          # macOS. One aarch64 runner cross-builds both Apple arches.
          - { os: macos-latest,   target: x86_64-apple-darwin,        musl: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       musl: false }
          # Windows (msvc). One x86_64 runner builds x86_64 + cross-builds ARM64.
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     musl: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,    musl: false }
    steps:
      - uses: actions/checkout@v7

      # Rust toolchain + target std, for all six targets (pinned — keep in sync with
      # .tool-versions). The musl jobs additionally get a cross-linker below.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # musl targets only: install the musl cross-linker so `cargo build` produces a
      # static, glibc-free binary (native; qemu-user for aarch64 on an x86_64 host).
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.musl
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin skimmd

      - name: Package
        shell: bash
        run: |
          # Version from the tag (refs/tags/v0.1.0 -> 0.1.0); the workflow only fires on v* tags.
          ver="${GITHUB_REF#refs/tags/v}"

          # Windows targets produce .exe; all others are plain ELF/Mach-O.
          ext=""
          case "${{ matrix.os }}" in *windows*) ext=".exe" ;; esac

          cp target/${{ matrix.target }}/release/skimmd${ext} \
             "skimmd-${ver}-${{ matrix.target }}${ext}"
          ls -l "skimmd-${ver}-${{ matrix.target }}${ext}"

      # Uploads the artifact, creating the release from the tag if it doesn't exist.
      - uses: softprops/action-gh-release@v3
        with:
          files: "skimmd-*"
          generate_release_notes: true
